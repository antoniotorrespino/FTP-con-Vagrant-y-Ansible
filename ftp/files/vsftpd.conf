# Modo independiente (standalone) y solo IPv4.
listen=YES
listen_ipv6=NO

# Acceso exclusivamente autenticado con cuentas locales.
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Archivos nuevos: 0666 menos máscara 0002 = 0664, legibles por Apache.
local_umask=002
file_open_mode=0666

# Mensajes y registros.
dirmessage_enable=YES
use_localtime=YES
log_ftp_protocol=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Enjaular a los usuarios en su home por defecto excepto ana
# allow_writeable_chroot=YES permite enjaular a un usuario aunque tenga
# permiso de escritura en la raiz de su jaula. Sin ella, vsftpd (desde la
# 2.3.5) rechaza el login con "500 OOPS: refusing to run with writable root
# inside chroot".
allow_writeable_chroot=YES
# Todos los usuarios locales quedan enjaulados en su home...
chroot_local_user=YES
# ...excepto los que aparecen en la lista (solo ana)
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot_list
# Configuracion por usuario (aqui se fija el directorio raiz FTP de ana)
user_config_dir=/etc/vsftpd/user_conf

# FTP explícito sobre TLS, sin SSL obsoleto.
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
ssl_sslv2=NO
ssl_sslv3=NO

# Certificado y clave privada (los genera ftp.yml en /etc/ssl/ftp)
rsa_cert_file=/etc/ssl/ftp/antoniotorres.test.crt
rsa_private_key_file=/etc/ssl/ftp/antoniotorres.test.key

# Rango pasivo para clientes detrás de NAT o cortafuegos.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.57.7

# Valores propios de Debian
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd