[defaults]
# Usuario SSH que usan por defecto las VMs de Vagrant
remote_user = vagrant
# Desactiva la comprobación de la huella SSH del servidor. Solo afecta a SSH
# (no a certificados TLS). Se hace así en esta práctica para simplificar las
# primeras conexiones, pero reduce la seguridad: no usar en producción.
host_key_checking = False
# Deja que Ansible detecte el Python del equipo remoto sin mostrar avisos
interpreter_python = auto_silent
# Inventario por defecto, así no hace falta escribir -i inventory.yml
inventory = inventory.yml